services:
  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - routex-net

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routex-user-service
    command: ["npm", "run", "start:user"]
    restart: unless-stopped
    environment:
      - PORT=4001
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - routex-net

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routex-chat-service
    command: ["npm", "run", "start:chat"]
    restart: unless-stopped
    environment:
      - PORT=4002
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - routex-net

  routex-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routex-gateway
    command: ["npm", "start"]
    restart: unless-stopped
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ROUTEX_CONFIG_PATH=config/gateway.docker.yaml
      - ROUTEX_ROUTES_PATH=config/routes.docker.yaml
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - routex-net

networks:
  routex-net:
    driver: bridge
