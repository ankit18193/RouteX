# RouteX Declarative Routes Configuration for Docker Environment

routes:
  - id: user_service_api
    pathPrefix: /api/v1/users
    upstream: http://user-service:4001
    stripPrefix: false
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    auth:
      mode: jwt
      requiredRoles: []
    rateLimit:
      enabled: true
      windowSec: 60
      limit: 100
      failurePolicy: fail-closed
      tiers:
        premium: 500
        free: 60
    cache:
      enabled: true
      ttlSec: 30
      respectCacheControl: true
      maxBodyBytes: 1048576
      varyBy:
        - accept
      allowAuthenticated: true
    circuitBreaker:
      enabled: true
      failureThreshold: 5
      resetTimeoutMs: 10000
      halfOpenMaxRequests: 2
      failureStatusCodes:
        - 500
        - 502
        - 503
        - 504
    timeouts:
      connectTimeoutMs: 2000
      responseTimeoutMs: 5000

  - id: chat_service_api
    pathPrefix: /api/v1/chats
    upstream: http://chat-service:4002
    stripPrefix: false
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    auth:
      mode: any
    rateLimit:
      enabled: true
      windowSec: 60
      limit: 120
      failurePolicy: fail-closed
    cache:
      enabled: true
      ttlSec: 15
      respectCacheControl: true
      maxBodyBytes: 1048576
      varyBy: []
      allowAuthenticated: false
    circuitBreaker:
      enabled: true
      failureThreshold: 5
      resetTimeoutMs: 10000
      halfOpenMaxRequests: 2
      failureStatusCodes:
        - 500
        - 502
        - 503
        - 504
    timeouts:
      connectTimeoutMs: 2000
      responseTimeoutMs: 5000

  - id: auth_login_public
    pathPrefix: /api/v1/auth
    upstream: http://user-service:4001
    stripPrefix: false
    methods:
      - POST
    auth:
      mode: public
    rateLimit:
      enabled: true
      windowSec: 60
      limit: 30
      failurePolicy: fail-open
    timeouts:
      connectTimeoutMs: 2000
      responseTimeoutMs: 3000
