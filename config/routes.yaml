# RouteX Declarative Routes Configuration

routes:
  - id: user_service_api
    pathPrefix: /api/v1/users
    upstream: http://localhost:4001
    stripPrefix: false
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    auth:
      mode: jwt
      requiredRoles: []
    rateLimit:
      enabled: true
      windowSec: 60
      limit: 100
      failurePolicy: fail-closed
      tiers:
        premium: 500
        free: 60
    timeouts:
      connectTimeoutMs: 1000
      responseTimeoutMs: 3000

  - id: chat_service_api
    pathPrefix: /api/v1/chats
    upstream: http://localhost:4002
    stripPrefix: false
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    auth:
      mode: any
    rateLimit:
      enabled: true
      windowSec: 60
      limit: 120
      failurePolicy: fail-closed
    timeouts:
      connectTimeoutMs: 1000
      responseTimeoutMs: 5000

  - id: auth_login_public
    pathPrefix: /api/v1/auth
    upstream: http://localhost:4001
    stripPrefix: false
    methods:
      - POST
    auth:
      mode: public
    rateLimit:
      enabled: true
      windowSec: 60
      limit: 10
      failurePolicy: fail-open
    timeouts:
      connectTimeoutMs: 1000
      responseTimeoutMs: 2000
